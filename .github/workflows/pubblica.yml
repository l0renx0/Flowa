name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sempre l'ultima versione del ramo principale
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/configure-pages@v6

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js version.json .nojekyll assets _site/
          if [ -d anteprima ]; then cp -r anteprima _site/; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
